# Création du namespace
apiVersion: v1
kind: Namespace
metadata:
  name: devsecops

---
# Déploiement de l'application Python
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app-deploy
  namespace: devsecops         # <-- On cible le namespace
  labels:
    app: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
      - name: python-app
        image: fabrice28/python-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: EXAMPLE_ENV
          value: "devsecops"

---
# Service pour exposer l'application
apiVersion: v1
kind: Service
metadata:
  name: python-app-service
  namespace: devsecops        # <-- Même namespace que le déploiement
spec:
  selector:
    app: python-app
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
